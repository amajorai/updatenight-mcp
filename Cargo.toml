[package]
name = "updatenight-mcp"
version = "0.1.0"
edition = "2021"
description = "Update Night MCP server — AI assistant tools for the catalog"
license = "MIT"
repository = "https://github.com/amajorai/updatenight-mcp"

[package.metadata.binstall]
pkg-url = "https://github.com/amajorai/updatenight-mcp/releases/download/v{ version }/updatenight-mcp-{ target }.tar.gz"
bin-dir = "updatenight-mcp{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/amajorai/updatenight-mcp/releases/download/v{ version }/updatenight-mcp-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "updatenight-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
dirs = "5"
dotenvy = "0.15"
open = "5"
